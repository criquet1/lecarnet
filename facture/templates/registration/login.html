{% extends "layouts/base.html" %}

{% block title %}
Connexion
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Connexion
                    </h2>

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Nom d'utilisateur ou mot de passe invalide.
                        </div>
                    {% endif %}

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Nom d'utilisateur
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                value="{{ form.username.value|default:'' }}"
                                required
                                autofocus>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Mot de passe
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                        {% if next %}
                            <input
                                type="hidden"
                                name="next"
                                value="{{ next }}">
                        {% endif %}

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Se connecter

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
