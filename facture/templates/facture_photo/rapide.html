{% load static %}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facture par photo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
<div class="text-center p-4" style="max-width: 400px;">

{% if envoye %}
    <div class="display-1 text-success mb-3">✓</div>
    <h4>Facture envoyée</h4>
    <p class="text-muted">Elle sera traitée plus tard dans la comptabilité.</p>
    <a href="{% url 'facture_photo_rapide' %}" class="btn btn-primary btn-lg mt-3">Envoyer une autre photo</a>
{% else %}
    <h4 class="mb-4">Facture par photo</h4>
    {% if erreur %}
        <div class="alert alert-danger">{{ erreur }}</div>
    {% endif %}
    <form method="post" enctype="multipart/form-data" action="{% url 'facture_photo_rapide' %}" id="form-envoi">
        {% csrf_token %}
        <input type="file" id="photo-input" name="photo" accept="image/*" capture="environment" class="d-none" required>
        <label for="photo-input" id="photo-label" class="btn btn-outline-primary btn-lg w-100 mb-3">📷 Prendre une photo</label>
        <button type="submit" id="bouton-envoyer" class="btn btn-primary btn-lg w-100">Envoyer</button>
    </form>
{% endif %}

</div>
<script>
(function () {
    var input = document.getElementById('photo-input');
    var label = document.getElementById('photo-label');
    if (input && label) {
        input.addEventListener('change', function () {
            if (input.files && input.files.length > 0) {
                label.textContent = '✓ Photo prête à envoyer';
                label.classList.remove('btn-outline-primary');
                label.classList.add('btn-success');
            }
        });
    }
})();
</script>
</body>
</html>
