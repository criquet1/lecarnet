{% load static %}

<aside class="sidebar">

    <nav class="sidebar-nav">

        {% with current_url=request.resolver_match.url_name current_namespace=request.resolver_match.namespace %}

        <!-- Tableau de bord -->
        <a href="{% url 'dashboard' %}"
           class="sidebar-link{% if current_url == 'dashboard' %} active{% endif %}"
              data-tooltip="Tableau de bord"
              aria-label="Tableau de bord"
              {% if current_url == 'dashboard' %}aria-current="page"{% endif %}>

            <i class="bi bi-grid-1x2-fill"></i>

        </a>

        <!-- Facturation -->
        <a href="{% url 'facture' %}"
           class="sidebar-link{% if current_url == 'facture' %} active{% endif %}"
              data-tooltip="Facturation"
              aria-label="Facturation"
              {% if current_url == 'facture' %}aria-current="page"{% endif %}>

            <i class="bi bi-receipt"></i>

        </a>

        <!-- Banque -->
        <a href="{% url 'releve_bancaire' %}"
           class="sidebar-link{% if current_url == 'releve_bancaire' or current_url == 'releve_ecriture_similaire' %} active{% endif %}"
              data-tooltip="Banque"
              aria-label="Banque"
              {% if current_url == 'releve_bancaire' or current_url == 'releve_ecriture_similaire' %}aria-current="page"{% endif %}>

            <i class="bi bi-bank"></i>

        </a>

        <!-- Paies -->
        <a href="{% url 'paie:paie_saisir' %}"
           class="sidebar-link{% if current_namespace == 'paie' and current_url != 'paie_parametres_taux' %} active{% endif %}"
              data-tooltip="Paies"
              aria-label="Paies"
              {% if current_namespace == 'paie' and current_url != 'paie_parametres_taux' %}aria-current="page"{% endif %}>

            <i class="bi bi-cash-stack"></i>

        </a>

        <!-- Rapports -->
<!-- Rapports -->
<a href="{% url 'journal_general' %}"
   class="sidebar-link{% if request.resolver_match.url_name in 'journal_general,grand_livre,balance_de_verification,compte_a_payer,compte_a_recevoir,rapport_de_taxes' %} active{% endif %}"
      data-tooltip="Rapports"
      aria-label="Rapports"
      {% if current_url in 'journal_general,grand_livre,balance_de_verification,compte_a_payer,compte_a_recevoir,rapport_de_taxes' %}aria-current="page"{% endif %}>

            <i class="bi bi-bar-chart-line"></i>

        </a>

            {% if can_switch_tenant %}
            <!-- Administration -->
            <a href="{% url 'administration' %}"
                class="sidebar-link{% if current_url in 'administration,settings,compte,totaux,creer_tenant,manage_societe_users,manage_societes,paie_parametres_taux' %} active{% endif %} sidebar-link-admin"
                     data-tooltip="Administration"
                     aria-label="Administration"
                     {% if current_url in 'administration,settings,compte,totaux,creer_tenant,manage_societe_users,manage_societes,paie_parametres_taux' %}aria-current="page"{% endif %}>

                  <i class="bi bi-gear-fill"></i>

            </a>
            {% endif %}

      {% endwith %}

    </nav>

</aside>
