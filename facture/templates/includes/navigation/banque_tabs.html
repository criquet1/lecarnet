{% load facture_extras %}
{% with active=request.resolver_match.url_name %}
<nav class="section-tabs reports-tabs" role="tablist" aria-label="Banque">
    <a href="{% url 'releve_bancaire' %}" class="section-tab{% if active == 'releve_bancaire' %} active{% endif %}" role="tab" aria-selected="{% if active == 'releve_bancaire' %}true{% else %}false{% endif %}">Relevés</a>
    <a href="{% url 'cheques' %}" class="section-tab{% if active == 'cheques' %} active{% endif %}" role="tab" aria-selected="{% if active == 'cheques' %}true{% else %}false{% endif %}">Chèques</a>
    <a href="{% url 'petite_caisse' %}" class="section-tab{% if active == 'petite_caisse' %} active{% endif %}" role="tab" aria-selected="{% if active == 'petite_caisse' %}true{% else %}false{% endif %}">Petite caisse</a>
    {% if request.user|has_interets_access %}
    <a href="{% url 'interets' %}" class="section-tab{% if active == 'interets' %} active{% endif %}" role="tab" aria-selected="{% if active == 'interets' %}true{% else %}false{% endif %}">Intérêts</a>
    {% endif %}
    <span class="section-tab disabled" role="tab" aria-disabled="true" tabindex="-1">Dépôts</span>
    <a href="{% url 'conciliation' %}" class="section-tab{% if active == 'conciliation' %} active{% endif %}" role="tab" aria-selected="{% if active == 'conciliation' %}true{% else %}false{% endif %}">Conciliation bancaire</a>
</nav>
{% endwith %}
