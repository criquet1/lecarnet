<h3 class="text-center mb-4">Inscrire une nouvelle transaction</h3>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
{% endif %}

<form method="post" action="{% url 'transactions' %}">
    {% csrf_token %}

    <table class="table table-bordered table-sm align-middle">
        <tbody>
            <tr>
                <td>
                    <input id="date_select" name="date_select" type="date"
                           class="form-control form-control-sm" required>
                </td>


                <td>
                    <select id="compagnie" name="compagnie"
                            class="form-select form-select-sm">
                        <option value="" selected disabled>Choisir une compagnie</option>
                        {% for compagnie in compagnies %}
                            <option value="{{ compagnie.id }}">{{ compagnie.nom }}</option>
                        {% endfor %}
                    </select>
                </td>




                <td>
                    <input id="description" name="description" type="text"
                           class="form-control form-control-sm"
                           placeholder="Description">
                </td>




                <td>
                    <input id="source" name="source" type="text"
                           class="form-control form-control-sm"
                           placeholder="Source ex: Facture, banque, paie">
                </td>

        </tbody>
    </table>

    <table class="table table-striped table-sm" id="line-items-table">
        <thead>
            <tr>
                <th style="width: 40%;">Compte</th>
                <th style="width: 30%;" class="text-end">Débit</th>
                <th style="width: 30%;" class="text-end">Crédit</th>
            </tr>
        </thead>

        <tbody id="line-items">
            <tr class="line-item">
                <td>
                    <select id="compte_1" name="comptes_comptables[]"
                            class="form-select form-select-sm">
                        <option value="" selected disabled>Choisir un compte</option>
                        {% for compte in comptes %}
                            <option value="{{ compte.numero }}"
                                    data-requires-company="{% if compte.pk == compte_cap_id or compte.pk == compte_car_id %}1{% else %}0{% endif %}">
                                {{ compte.numero }} - {{ compte.libelle }}
                            </option>
                        {% endfor %}
                    </select>
                </td>

                <td>
                    <input id="debit_1" name="montant_debit[]" type="text"
                           class="form-control form-control-sm text-end"
                           placeholder="0.00">
                </td>

                <td>
                    <input id="credit_1" name="montant_credit[]" type="text"
                           class="form-control form-control-sm text-end"
                           placeholder="0.00">
                </td>
            </tr>
        </tbody>
    </table>

    <div class="mt-3 d-flex gap-2">
        <button type="button" id="add-line" class="btn btn-outline-secondary btn-sm">
            Ajouter une ligne
        </button>

        <button type="submit" id="save-transaction" class="btn btn-primary btn-sm">
            Sauvegarder la transaction
        </button>
    </div>
</form>

<script>
(function () {
    const lineItems = document.getElementById("line-items");
    const addLineButton = document.getElementById("add-line");
    const companySelect = document.getElementById("compagnie");
    const comptesOptionsHtml = document.getElementById("compte_1").innerHTML;
    let rowIndex = 1;

    function syncCompanyRequirement() {
        const accountSelects = lineItems.querySelectorAll('select[name="comptes_comptables[]"]');
        const companyRequired = Array.from(accountSelects).some(function (select) {
            const option = select.options[select.selectedIndex];
            return option && option.dataset.requiresCompany === "1";
        });

        companySelect.required = companyRequired;
    }

    lineItems.addEventListener("change", function (event) {
        if (event.target.matches('select[name="comptes_comptables[]"]')) {
            syncCompanyRequirement();
        }
    });

    addLineButton.addEventListener("click", function () {
        rowIndex += 1;

        const row = document.createElement("tr");
        row.className = "line-item";
        row.innerHTML = [
            '<td>',
            '  <select id="compte_' + rowIndex + '" name="comptes_comptables[]" class="form-select form-select-sm">' + comptesOptionsHtml + '</select>',
            '</td>',
            '<td>',
            '  <input id="debit_' + rowIndex + '" name="montant_debit[]" type="text" class="form-control form-control-sm text-end" placeholder="0.00">',
            '</td>',
            '<td>',
            '  <input id="credit_' + rowIndex + '" name="montant_credit[]" type="text" class="form-control form-control-sm text-end" placeholder="0.00">',
            '</td>'
        ].join('');

        lineItems.appendChild(row);
        syncCompanyRequirement();
    });

    syncCompanyRequirement();
})();
</script>
